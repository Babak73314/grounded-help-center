# The local database: PostgreSQL 16 with pgvector, the same major version as
# the Aurora cluster in infra/. The credentials are for this throwaway
# container only; it listens on 127.0.0.1 and nowhere else.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: help
      POSTGRES_PASSWORD: help
      POSTGRES_DB: help
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U help -d help']
      interval: 2s
      timeout: 3s
      retries: 30
